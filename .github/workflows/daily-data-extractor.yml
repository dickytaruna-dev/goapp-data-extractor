name: GoApp Daily Data Extractor & API Dispatcher

on:
  schedule:
    # 00:00 WIB (Asia/Jakarta) = 17:00 UTC
    - cron: "0 17 * * *"

  workflow_dispatch:
    inputs:
      target_date:
        description: "Target extraction date (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""
      brands:
        description: "Comma-separated brands to extract (e.g. IKONS,MODULO,ZBOM)"
        required: false
        default: "IKONS,MODULO,ZBOM"
      dry_run:
        description: "Dry run (extract & convert without sending to API)"
        type: boolean
        required: false
        default: false

concurrency:
  group: goapp-data-extractor
  cancel-in-progress: false

jobs:
  extract-and-dispatch:
    name: Extract GoApp Reports & Dispatch API
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run GoApp Data Extractor
        env:
          # GoApp Credentials
          GOAPP_EMAIL: ${{ secrets.GOAPP_EMAIL }}
          GOAPP_PASSWORD: ${{ secrets.GOAPP_PASSWORD }}
          
          # Brand Workspace Settings (Optional secret overrides)
          IKONS_BUSINESS_ID: ${{ secrets.IKONS_BUSINESS_ID }}
          IKONS_REPORT_ID: ${{ secrets.IKONS_REPORT_ID }}
          MODULO_BUSINESS_ID: ${{ secrets.MODULO_BUSINESS_ID }}
          MODULO_REPORT_ID: ${{ secrets.MODULO_REPORT_ID }}
          ZBOM_BUSINESS_ID: ${{ secrets.ZBOM_BUSINESS_ID }}
          ZBOM_REPORT_ID: ${{ secrets.ZBOM_REPORT_ID }}
          
          # Target API Settings
          API_ENDPOINT_URL: ${{ secrets.API_ENDPOINT_URL }}
          API_TIMEOUT_SECONDS: ${{ secrets.API_TIMEOUT_SECONDS || '60' }}
          API_MAX_RETRIES: ${{ secrets.API_MAX_RETRIES || '3' }}
          
          # JWT Security Settings
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM || 'HS256' }}
          JWT_EXPIRY_SECONDS: ${{ secrets.JWT_EXPIRY_SECONDS || '3600' }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'goapp-data-extractor' }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          STATIC_BEARER_TOKEN: ${{ secrets.STATIC_BEARER_TOKEN }}
          
          # Runtime flags
          HEADLESS: "true"
          KEEP_LOCAL_FILES: "false"
        run: |
          ARGS=""
          
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          
          if [ -n "${{ github.event.inputs.brands }}" ]; then
            ARGS="$ARGS --brands ${{ github.event.inputs.brands }}"
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          echo "Executing: python -u main.py $ARGS"
          PYTHONUNBUFFERED=1 python -u main.py $ARGS

      - name: Upload Debug Screenshots / Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: goapp-debug-logs
          path: |
            logs/
            data/*.json
          retention-days: 7
